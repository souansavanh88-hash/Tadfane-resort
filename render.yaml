services:
  - type: web
    name: tadfane-resort
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
    disk:
      name: tadfane-data
      mountPath: /var/data
      sizeGB: 1
